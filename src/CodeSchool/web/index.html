<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code School</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav class="side" aria-label="Code School">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ff5a4e"/><path d="M9 23 L16 16 L23 9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="9" cy="23" r="3.4" fill="#fff"/><circle cx="16" cy="16" r="3.4" fill="#fff"/><circle cx="23" cy="9" r="3.4" fill="#fff"/></svg><span>Code School</span></div>
  <button class="nav on" data-view="route"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19 L12 12 L19 5"/><circle cx="5" cy="19" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/></svg><span>My route</span></button>
  <button class="nav" data-view="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8M12 8v8"/></svg><span>Projects</span></button>
  <button class="nav" data-view="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.3"/><path d="M4 4v5h5"/></svg><span>Practice</span></button>
  <button class="nav" data-view="playground"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7 3 12l5 5M16 7l5 5-5 5"/></svg><span>Playground</span></button>
  <button class="nav" data-view="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Coach</span></button>
  <div class="grow"></div>
  <div class="voice" id="voicebox"><span class="wave" aria-hidden="true"><i></i><i></i><i></i></span><span>Voice coach</span><button id="voice-toggle" aria-pressed="true">On</button></div>
  <small id="side-note"></small>
</nav>
<main id="main"></main>
<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Lesson">
  <div class="ptop"><button class="ghost" id="close" aria-label="Back">✕</button><span class="title" id="ptitle"></span><div class="prog"><i id="bar"></i></div><span class="streak" id="streak"></span></div>
  <div class="stage" id="stage"></div>
  <div class="foot" id="foot"><div><div class="msg" id="msg"></div><button class="go" id="act">Continue</button></div></div>
</div>
<canvas id="fx"></canvas>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
