name: Build Code School

# Builds "Code School.exe" on GitHub's own Windows machines from this repository's code.
# Push to main: an exe you can download from the run's Artifacts. Push a tag like v0.1.0: a Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check every lesson exercise with a correct answer, and the runner
        run: python tools/check_lessons.py

      - name: Check the natural voices (downloads, unpacks with Windows tar, and really speaks with the app's settings)
        shell: pwsh
        run: |
          $cat = Get-Content src/CodeSchool/web/voices.json -Raw | ConvertFrom-Json
          Invoke-WebRequest $cat.engine.url -OutFile engine.tar.bz2
          Invoke-WebRequest $cat.pack.url -OutFile pack.tar.bz2
          Write-Host ("engine {0} MB, voices {1} MB (catalog says {2} and {3})" -f [math]::Round((Get-Item engine.tar.bz2).Length/1MB), [math]::Round((Get-Item pack.tar.bz2).Length/1MB), $cat.engine.mb, $cat.pack.mb)
          New-Item -ItemType Directory engine, pack | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf engine.tar.bz2 -C engine
          & "$env:SystemRoot\System32\tar.exe" -xf pack.tar.bz2 -C pack
          $exe = Get-ChildItem engine -Recurse -Filter sherpa-onnx-offline-tts.exe | Select-Object -First 1
          $model = (Get-ChildItem pack -Recurse -Filter model.int8.onnx | Select-Object -First 1) ?? (Get-ChildItem pack -Recurse -Filter model.onnx | Select-Object -First 1)
          if (-not $exe) { throw "no sherpa-onnx-offline-tts.exe in the engine download" }
          if (-not $model) { throw "no model in the voice pack" }
          $d = $model.DirectoryName
          Write-Host "Pack files:"; Get-ChildItem $d | ForEach-Object { Write-Host "  $($_.Name)" }
          Push-Location $exe.DirectoryName
          & $exe.FullName --help 2>&1 | Select-String "kokoro" | ForEach-Object { Write-Host "  flag: $_" }
          $args = @("--kokoro-model=$($model.FullName)", "--kokoro-voices=$d\voices.bin", "--kokoro-tokens=$d\tokens.txt", "--kokoro-data-dir=$d\espeak-ng-data")
          if (Test-Path "$d\lexicon-us-en.txt") { $args += "--kokoro-lexicon=$d\lexicon-us-en.txt" }
          $args += @("--kokoro-length-scale=1.00", "--num-threads=2", "--sid=3", "--output-filename=$env:GITHUB_WORKSPACE\say.wav", "Nice work, Dilan. That passed every check.")
          $t = Measure-Command { & $exe.FullName @args 2>&1 | Select-Object -Last 4 | ForEach-Object { Write-Host "  $_" } }
          Pop-Location
          if (-not (Test-Path say.wav)) { throw "Kokoro made no sound file" }
          $size = (Get-Item say.wav).Length
          if ($size -lt 20000) { throw "Kokoro made a sound file of only $size bytes" }
          Write-Host ("Kokoro spoke: say.wav is {0} bytes, made in {1:N1} seconds including loading" -f $size, $t.TotalSeconds)

      - name: Get Python to carry inside the app (official embeddable package from python.org)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/CodeSchool/embed | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip -OutFile src/CodeSchool/embed/python.zip
          if ((Get-Item src/CodeSchool/embed/python.zip).Length -lt 5mb) { throw "Python download looks wrong" }

      - name: Build single-file exe
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.1.$env:GITHUB_RUN_NUMBER" }
          dotnet publish src/CodeSchool/CodeSchool.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$version -o out
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "out/Code School.exe" "dist/Code School.exe"
          $h = (Get-FileHash "dist/Code School.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  Code School.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Code-School
          path: dist/

      # Every successful build of main becomes a numbered release (0.1.<run>), so the Releases page always has
      # the newest Code School.exe. Tags pushed by hand (v1.2.3) publish under their own name.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: Code School ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **Code School.exe** below and double-click it. It's one file: the lessons and Python are inside.
            Windows may say it doesn't recognise the app (it isn't code-signed yet): choose More info, then Run anyway.
          files: |
            dist/Code School.exe
            dist/SHA256SUMS.txt
